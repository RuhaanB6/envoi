[DEFAULT]
# NOTE: yoyo splits `sources` on whitespace, so an absolute path containing
# spaces (as %(here)s does on some machines) silently resolves to nothing.
# Keep this relative -- always run yoyo from the backend/ directory.
sources = migrations
# The "+psycopg" suffix tells yoyo to use psycopg 3 (this project's driver)
# instead of defaulting to psycopg2, which isn't installed.
database = postgresql+psycopg://cs348:cs348@localhost:5432/cs348
